<script>
(function(){
var W=1600,H=900,name=(location.pathname.split('/').pop()||'banner').replace(/\.html?$/,'');
var msg=function(t){var m=document.getElementById('mw-msg');if(m)m.textContent=t||''};
function svgSource(){
  var node=document.querySelector('.canvas').cloneNode(true);
  var css=Array.prototype.map.call(document.querySelectorAll('style:not(.mw)'),function(s){return s.textContent}).join('\n');
  var font=getComputedStyle(document.body).fontFamily.replace(/"/g,"'");
  var xml=new XMLSerializer().serializeToString(node);
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'"><foreignObject width="'+W+'" height="'+H+'"><div xmlns="http://www.w3.org/1999/xhtml" style="width:'+W+'px;height:'+H+'px;font-family:'+font+'"><style><![CDATA['+css+']]></style>'+xml+'</div></foreignObject></svg>';
}
function download(){
  msg('Generating…');
  var img=new Image();
  img.onload=function(){
    try{
      var c=document.createElement('canvas');c.width=W;c.height=H;
      c.getContext('2d').drawImage(img,0,0);
      c.toBlob(function(b){
        if(!b){msg('Export is not supported in this browser.');return}
        var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.png';
        document.body.appendChild(a);a.click();a.remove();msg('Saved '+name+'.png');
      },'image/png');
    }catch(e){msg('Export is not supported in this browser.')}
  };
  img.onerror=function(){msg('Could not generate the image.')};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgSource());
}
var b=document.getElementById('mw-dl');if(b)b.addEventListener('click',download);
window.addEventListener('message',function(e){if(e.data==='mw-download')download()});
})();
</script></body></html>
