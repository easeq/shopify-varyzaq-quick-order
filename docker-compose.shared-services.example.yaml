# Optional shared low-resource infrastructure. Create first: docker network create shopify-platform
services:
  shopify-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - shopify-platform-postgres:/var/lib/postgresql
    networks:
      - shopify-platform
  shopify-redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    volumes:
      - shopify-platform-redis:/data
    networks:
      - shopify-platform
volumes:
  shopify-platform-postgres:
  shopify-platform-redis:
networks:
  shopify-platform: { external: true }
